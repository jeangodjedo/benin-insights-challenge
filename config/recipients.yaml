# BeninSentinel — Annuaire des destinataires d'alerte
#
# Ce fichier liste qui peut recevoir des alertes BeninSentinel et comment.
# Modifiable par les autorités sans intervention sur le code (versionné en Git
# pour audit complet). Toute modification doit être validée par le porteur
# institutionnel désigné (ANSSI-Bénin par défaut).
#
# Format d'une entrée :
#   - name    : libellé humain de la personne / de la fonction
#     role    : code de rôle utilisé dans notification_rules.yaml
#     channel : "email" | "webhook" | "sms" | "console"
#     address : adresse cible (email, URL webhook, n° de téléphone)
#     active  : true / false (permet de désactiver sans supprimer)
#     notes   : optionnel, contexte d'usage
#
# CONFIGURATION DÉMONSTRATION FINALE
# ----------------------------------
# Pendant la démo, tous les destinataires pointent vers devpancrace@gmail.com
# pour que les bulletins déclenchés par l'orchestrateur soient effectivement
# reçus et puissent être montrés au jury. À remplacer par les coordonnées
# officielles avant mise en production.

recipients:
  # ── Niveau stratégique — Présidence et Cabinet ────────────────
  - name:    Cabinet Présidence — Conseil restreint
    role:    presidence_cabinet
    channel: email
    address: devpancrace@gmail.com
    active:  true
    notes:   À utiliser pour les alertes ROUGE uniquement.

  - name:    Cellule veille — Présidence
    role:    presidence_veille
    channel: email
    address: devpancrace@gmail.com
    active:  true

  # ── Ministère de l'Intérieur ──────────────────────────────────
  - name:    Cabinet Ministre Intérieur
    role:    interieur_cabinet
    channel: email
    address: devpancrace@gmail.com
    active:  true

  - name:    Direction Générale Sécurité Publique
    role:    interieur_securite
    channel: email
    address: devpancrace@gmail.com
    active:  true

  # ── Préfets des départements frontaliers nord ─────────────────
  - name:    Préfecture Alibori
    role:    prefecture_frontaliere
    channel: email
    address: devpancrace@gmail.com
    active:  true
    notes:   Zone à risque frontalier nord (Niger, Burkina Faso).

  - name:    Préfecture Atacora
    role:    prefecture_frontaliere
    channel: email
    address: devpancrace@gmail.com
    active:  true
    notes:   Zone à risque frontalier nord-ouest (Burkina Faso).

  - name:    Préfecture Borgou
    role:    prefecture_frontaliere
    channel: email
    address: devpancrace@gmail.com
    active:  true

  # ── Communication publique ────────────────────────────────────
  - name:    Agence Béninoise de Communication (ABC)
    role:    communication_publique
    channel: email
    address: devpancrace@gmail.com
    active:  true
    notes:   Cible le programme d'amplification narrative (action 03).

  # ── Sécurité numérique ────────────────────────────────────────
  - name:    ANSSI-Bénin — porteur institutionnel BeninSentinel
    role:    anssi_porteur
    channel: email
    address: devpancrace@gmail.com
    active:  true
    notes:   Porteur opérationnel du déploiement BeninSentinel.

  # ── Intégrations techniques (webhooks) ────────────────────────
  - name:    Bus de messages — Centre National Coordination Crise
    role:    cnc_bus_messages
    channel: webhook
    address: https://example-cnc.gov.bj/webhooks/sentinel
    active:  false   # à activer une fois l'intégration confirmée
    notes:   Intégration au SI propre du Centre de coordination.

  # ── Journal de secours (toujours actif) ───────────────────────
  - name:    Journal d'alerte local (audit BeninSentinel)
    role:    audit_journal
    channel: console
    address: data/alerts_journal/
    active:  true
    notes:   Provider de fallback — toujours actif pour traçabilité.
